<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Livros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="min-h-screen bg-gray-100 p-4 font-sans bg-cover bg-center bg-fixed">

  <div id="settings-backdrop" onclick="fecharMenu()" class="hidden fixed inset-0 z-40 bg-black/40" aria-hidden="true"></div>
  <aside id="settings-drawer" class="fixed inset-y-0 right-0 z-50 w-80 max-w-[88vw] translate-x-full bg-white shadow-2xl transition-transform duration-300" aria-label="Menu do usuário" aria-hidden="true">
    <div class="flex items-center justify-between border-b border-gray-200 p-5">
      <h2 class="text-lg font-semibold text-gray-800">Menu do usuário</h2>
      <button type="button" onclick="fecharMenu()" class="h-9 w-9 rounded-full text-xl text-gray-600 hover:bg-gray-100" aria-label="Fechar menu">×</button>
    </div>
    <nav class="space-y-1 p-4" aria-label="Opções">
      <a href="#form-card" onclick="fecharMenu()" class="block rounded px-3 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100">Cadastrar livro</a>
      <a href="#my-books" onclick="fecharMenu()" class="block rounded px-3 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100">Meu acervo</a>
      <div class="mt-5 border-t border-gray-200 pt-5">
        <h3 class="px-3 text-sm font-semibold text-gray-800">Personalização</h3>
        <label for="background-upload" class="mt-3 flex cursor-pointer items-center gap-3 rounded px-3 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100">
          <span aria-hidden="true" class="text-lg">▧</span>
          Escolher imagem de fundo
        </label>
        <input id="background-upload" type="file" accept="image/*" onchange="alterarFundo(event)" class="hidden">
        <button type="button" onclick="removerFundo()" class="w-full rounded px-3 py-3 text-left text-sm font-medium text-gray-700 hover:bg-gray-100">Restaurar fundo padrão</button>
      </div>
    </nav>
  </aside>

  <main class="mx-auto max-w-md">
  <header class="mb-6 flex items-center justify-between gap-3">
    <h1 class="text-2xl font-bold text-gray-800">📚 Cadastro de Livros</h1>
    <button id="menu-button" type="button" onclick="abrirMenu()" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white text-xl text-gray-700 shadow hover:bg-gray-50" aria-label="Abrir menu do usuário" aria-controls="settings-drawer" aria-expanded="false">☰</button>
  </header>

  <!-- Botão de Escanear -->
  <div class="mb-4">
    <button id="btn-scan" onclick="toggleScanner()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-blue-700 active:scale-95 transition">
      📷 Escanear Código de Barras
    </button>
  </div>

  <!-- Contêiner do Scanner (Oculto) -->
  <div id="scanner-container" class="hidden bg-black rounded-lg overflow-hidden mb-6 shadow">
    <div id="interactive" class="w-full"></div>
    <button onclick="stopScanner()" class="w-full bg-red-600 text-white py-2 text-sm font-semibold">
      Fechar Câmera
    </button>
  </div>

  <!-- Busca por Nome / ISBN Manual -->
  <section class="bg-white p-4 rounded-lg shadow mb-6">
    <h2 class="text-sm font-semibold text-gray-600 mb-2">Buscar em bases externas</h2>
    <div class="flex gap-2">
      <input type="text" id="input-search" placeholder="Título, autor ou ISBN..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="buscarPorTexto()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-900">
        Buscar
      </button>
    </div>
  </section>

  <!-- FORMULÁRIO DE CONFIRMAÇÃO DO CADASTRO (Preenchido Automaticamente) -->
  <section id="form-card" class="hidden bg-white p-4 rounded-lg shadow border-l-4 border-blue-600 mb-6">
    <h2 id="form-title" class="text-base font-bold text-gray-800 mb-3">Confirmar Cadastro</h2>
    
    <div class="flex gap-4 mb-4">
      <div class="relative h-28 w-20 shrink-0">
        <img id="book-cover" src="" alt="Capa" class="h-full w-full rounded bg-gray-200 object-cover shadow-sm" onerror="usarCapaPadrao(this)">
        <button type="button" onclick="document.getElementById('cover-upload').click()" class="absolute -bottom-2 -right-2 flex h-8 w-8 items-center justify-center rounded-full bg-white text-base text-gray-700 shadow hover:bg-gray-100" title="Enviar uma capa" aria-label="Enviar uma capa">✎</button>
        <input id="cover-upload" type="file" accept="image/*" onchange="alterarCapa(event)" class="hidden">
      </div>
      <div class="flex-1 space-y-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500">Título</label>
          <input type="text" id="field-title" class="w-full border rounded px-2 py-1 text-sm bg-gray-50 font-medium">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500">Autor(es)</label>
          <input type="text" id="field-author" class="w-full border rounded px-2 py-1 text-sm bg-gray-50">
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500">Gênero</label>
          <input type="text" id="field-genre" placeholder="Ex: Ficção, História..." class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500">Nicho da Estante (Nº)</label>
          <input type="number" id="field-niche" placeholder="Ex: 3" min="1" class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500">ISBN</label>
        <input type="text" id="field-isbn" readonly class="w-full border rounded px-2 py-1 text-xs font-mono bg-gray-100 text-gray-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label for="field-acquired-date" class="block text-xs font-semibold text-gray-500">Data de aquisição</label>
          <input type="date" id="field-acquired-date" class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="field-finished-date" class="block text-xs font-semibold text-gray-500">Data de término</label>
          <input type="date" id="field-finished-date" class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500">Sua nota</label>
        <input type="hidden" id="field-rating" value="0">
        <div class="flex gap-1" role="group" aria-label="Nota de 1 a 5 estrelas">
          <button type="button" data-rating="1" onclick="selecionarNota(1)" class="text-2xl text-gray-300" aria-label="1 estrela" aria-pressed="false">★</button>
          <button type="button" data-rating="2" onclick="selecionarNota(2)" class="text-2xl text-gray-300" aria-label="2 estrelas" aria-pressed="false">★</button>
          <button type="button" data-rating="3" onclick="selecionarNota(3)" class="text-2xl text-gray-300" aria-label="3 estrelas" aria-pressed="false">★</button>
          <button type="button" data-rating="4" onclick="selecionarNota(4)" class="text-2xl text-gray-300" aria-label="4 estrelas" aria-pressed="false">★</button>
          <button type="button" data-rating="5" onclick="selecionarNota(5)" class="text-2xl text-gray-300" aria-label="5 estrelas" aria-pressed="false">★</button>
        </div>
      </div>

      <div>
        <label for="field-comment" class="block text-xs font-semibold text-gray-500">Comentário</label>
        <textarea id="field-comment" rows="3" placeholder="Anotações sobre a leitura..." class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="cancelarCadastro()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded text-xs font-semibold hover:bg-gray-300">
          Cancelar
        </button>
        <button id="save-book-button" onclick="salvarLivro()" class="flex-1 bg-green-600 text-white py-2 rounded text-xs font-semibold hover:bg-green-700">
          Salvar no Acervo
        </button>
      </div>
    </div>
  </section>

  <!-- Lista de Livros Cadastrados -->
  <section id="my-books" class="bg-white p-4 rounded-lg shadow">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-lg font-semibold text-gray-700">Meus Livros (<span id="total-books">0</span>)</h2>
      <div class="flex gap-2">
        <button type="button" onclick="exportarAcervo()" class="px-3 py-2 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded" title="Baixar uma cópia portátil do acervo">Exportar</button>
        <button type="button" onclick="document.getElementById('input-import-library').click()" class="px-3 py-2 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded" title="Adicionar livros de um arquivo de acervo">Importar</button>
        <input id="input-import-library" type="file" accept=".json,application/json" onchange="importarAcervo(event)" class="hidden">
      </div>
    </div>
    <label for="input-library-search" class="sr-only">Pesquisar nos livros salvos</label>
    <div class="relative mb-2">
      <span aria-hidden="true" class="absolute left-3 top-2 text-gray-400">⌕</span>
      <input type="search" id="input-library-search" oninput="carregarListaSalva()" placeholder="Pesquisar no meu acervo..." class="w-full border rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <p class="text-xs text-gray-500 mb-2"><span id="visible-books">0</span> exibido(s)</p>
    <ul id="books-list" class="divide-y divide-gray-200">
      <li class="py-2 text-sm text-gray-500 text-center">Nenhum livro cadastrado ainda.</li>
    </ul>
  </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
