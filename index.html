<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Livros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans max-w-md mx-auto">

  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-gray-800">📚 Cadastro de Livros</h1>
  </header>

  <!-- Botão de Escanear -->
  <div class="mb-4">
    <button id="btn-scan" onclick="toggleScanner()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-blue-700 active:scale-95 transition">
      📷 Escanear Código de Barras
    </button>
  </div>

  <!-- Contêiner do Scanner (Oculto) -->
  <div id="scanner-container" class="hidden bg-black rounded-lg overflow-hidden mb-6 shadow">
    <div id="interactive" class="w-full"></div>
    <button onclick="stopScanner()" class="w-full bg-red-600 text-white py-2 text-sm font-semibold">
      Fechar Câmera
    </button>
  </div>

  <!-- Busca por Nome / ISBN Manual -->
  <section class="bg-white p-4 rounded-lg shadow mb-6">
    <h2 class="text-sm font-semibold text-gray-600 mb-2">Busca Manual</h2>
    <div class="flex gap-2">
      <input type="text" id="input-search" placeholder="Título, autor ou ISBN..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="buscarPorTexto()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-900">
        Buscar
      </button>
    </div>
  </section>

  <!-- FORMULÁRIO DE CONFIRMAÇÃO DO CADASTRO (Preenchido Automaticamente) -->
  <section id="form-card" class="hidden bg-white p-4 rounded-lg shadow border-l-4 border-blue-600 mb-6">
    <h2 class="text-base font-bold text-gray-800 mb-3">Confirmar Cadastro</h2>
    
    <div class="flex gap-4 mb-4">
      <img id="book-cover" src="" alt="Capa" class="w-20 h-28 object-cover rounded bg-gray-200 shadow-sm">
      <div class="flex-1 space-y-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500">Título</label>
          <input type="text" id="field-title" class="w-full border rounded px-2 py-1 text-sm bg-gray-50 font-medium">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500">Autor(es)</label>
          <input type="text" id="field-author" class="w-full border rounded px-2 py-1 text-sm bg-gray-50">
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500">Gênero</label>
          <input type="text" id="field-genre" placeholder="Ex: Ficção, História..." class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500">Nicho da Estante (Nº)</label>
          <input type="number" id="field-niche" placeholder="Ex: 3" min="1" class="w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500">ISBN</label>
        <input type="text" id="field-isbn" readonly class="w-full border rounded px-2 py-1 text-xs font-mono bg-gray-100 text-gray-500">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="cancelarCadastro()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded text-xs font-semibold hover:bg-gray-300">
          Cancelar
        </button>
        <button onclick="salvarLivro()" class="flex-1 bg-green-600 text-white py-2 rounded text-xs font-semibold hover:bg-green-700">
          Salvar no Acervo
        </button>
      </div>
    </div>
  </section>

  <!-- Lista de Livros Cadastrados -->
  <section class="bg-white p-4 rounded-lg shadow">
    <h2 class="text-lg font-semibold mb-3 text-gray-700">Meus Livros (<span id="total-books">0</span>)</h2>
    <ul id="books-list" class="divide-y divide-gray-200">
      <li class="py-2 text-sm text-gray-500 text-center">Nenhum livro cadastrado ainda.</li>
    </ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
