<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar acervo</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./theme.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body data-admin-page="true" class="min-h-screen bg-gray-100 p-4 font-sans">
  <main id="app-shell" class="mx-auto max-w-3xl">
    <section class="hidden" data-admin-only>
      <header class="mb-6 flex items-center justify-between gap-3">
        <div>
          <p class="text-xs font-semibold uppercase text-emerald-800">Área administrativa</p>
          <h1 class="text-2xl font-bold text-gray-900">Gerenciar acervo</h1>
        </div>
        <div class="flex items-center gap-2">
          <a href="./biblioteca.html" class="rounded border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Ver catálogo</a>
          <button id="admin-logout" type="button" onclick="logoutUsuario()" class="rounded bg-gray-900 px-3 py-2 text-sm font-semibold text-white hover:bg-gray-800" data-admin-only>Sair</button>
        </div>
      </header>

      <div class="mb-4">
        <button id="btn-scan" onclick="toggleScanner()" class="w-full rounded bg-blue-700 py-3 font-semibold text-white shadow hover:bg-blue-800">Escanear código de barras</button>
      </div>

      <div id="scanner-container" class="mb-6 hidden overflow-hidden rounded bg-black shadow" data-admin-preserve-hidden="true">
        <div id="interactive" class="w-full"></div>
        <button onclick="stopScanner()" class="w-full bg-red-700 py-2 text-sm font-semibold text-white">Fechar câmera</button>
      </div>

      <section class="mb-6 rounded border border-gray-200 bg-white p-4 shadow-sm">
        <h2 class="mb-2 text-sm font-semibold text-gray-700">Buscar em bases externas</h2>
        <div class="flex gap-2">
          <input type="search" id="input-search" placeholder="Título, autor ou ISBN..." class="min-w-0 flex-1 rounded border border-gray-300 px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-100">
          <button onclick="buscarPorTexto()" class="rounded bg-gray-900 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-800">Buscar</button>
        </div>
      </section>

      <button type="button" onclick="preencherFormularioLivro({ title: '', authors: [], categories: [] }, '')" class="mb-6 rounded bg-emerald-800 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-900">Adicionar livro manualmente</button>

      <section id="form-card" class="mb-6 hidden rounded border border-gray-300 border-l-4 border-l-blue-700 bg-white p-4 shadow-sm" data-admin-only data-admin-preserve-hidden="true">
        <h2 id="form-title" class="mb-3 text-base font-bold text-gray-900">Confirmar cadastro</h2>
        <div class="mb-4 flex gap-4">
          <div class="relative h-28 w-20 shrink-0">
            <img id="book-cover" src="" alt="Capa do livro" onerror="usarCapaPadrao(this)" class="h-full w-full rounded border border-gray-200 bg-gray-100 object-cover">
            <button type="button" onclick="document.getElementById('cover-upload').click()" class="absolute -bottom-2 -right-2 flex h-8 w-8 items-center justify-center rounded-full bg-white text-gray-700 shadow" title="Enviar uma capa" aria-label="Enviar uma capa">+</button>
            <input id="cover-upload" type="file" accept="image/*" onchange="alterarCapa(event)" class="hidden">
          </div>
          <div class="flex-1 space-y-2">
            <label class="block text-xs font-semibold text-gray-600">Título<input type="text" id="field-title" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
            <label class="block text-xs font-semibold text-gray-600">Autor(es)<input type="text" id="field-author" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
          </div>
        </div>

        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <label class="block text-xs font-semibold text-gray-600">Gênero<input type="text" id="field-genre" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
            <label class="block text-xs font-semibold text-gray-600">Nicho da estante<input type="text" id="field-niche" inputmode="text" placeholder="Ex: A1, Seção 2" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
          </div>
          <fieldset>
            <legend class="mb-1 text-xs font-semibold text-gray-600">Marcador no livro</legend>
            <input type="hidden" id="field-bookmark-color" value="">
            <div class="flex gap-2" role="group" aria-label="Cor do marcador">
              <button type="button" data-bookmark-color="" onclick="selecionarCorMarcador('')" class="flex h-9 w-9 items-center justify-center rounded border border-gray-400 bg-white text-sm text-gray-600" title="Sem marcador" aria-label="Sem marcador" aria-pressed="true">×</button>
              <button type="button" data-bookmark-color="green" onclick="selecionarCorMarcador('green')" class="h-9 w-9 rounded border border-gray-400 bg-green-600" title="Verde" aria-label="Marcador verde" aria-pressed="false"></button>
              <button type="button" data-bookmark-color="blue" onclick="selecionarCorMarcador('blue')" class="h-9 w-9 rounded border border-gray-400 bg-blue-600" title="Azul" aria-label="Marcador azul" aria-pressed="false"></button>
              <button type="button" data-bookmark-color="yellow" onclick="selecionarCorMarcador('yellow')" class="h-9 w-9 rounded border border-gray-400 bg-yellow-400" title="Amarelo" aria-label="Marcador amarelo" aria-pressed="false"></button>
              <button type="button" data-bookmark-color="brown" onclick="selecionarCorMarcador('brown')" class="h-9 w-9 rounded border border-gray-400 bg-amber-900" title="Marrom" aria-label="Marcador marrom" aria-pressed="false"></button>
              <button type="button" data-bookmark-color="black" onclick="selecionarCorMarcador('black')" class="h-9 w-9 rounded border border-gray-400 bg-black" title="Preto" aria-label="Marcador preto" aria-pressed="false"></button>
            </div>
          </fieldset>
          <label class="block text-xs font-semibold text-gray-600">ISBN<input type="text" id="field-isbn" readonly class="mt-1 w-full rounded border border-gray-200 bg-gray-100 px-2 py-1.5 font-mono text-xs text-gray-500"></label>
          <div class="grid grid-cols-2 gap-2">
            <label class="block text-xs font-semibold text-gray-600">Data de aquisição<input type="date" id="field-acquired-date" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
            <label class="block text-xs font-semibold text-gray-600">Data de término<input type="date" id="field-finished-date" class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></label>
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-gray-600">Sua nota</label>
            <input type="hidden" id="field-rating" value="0">
            <div class="flex gap-1" role="group" aria-label="Nota de 1 a 5 estrelas">
              <button type="button" data-rating="1" onclick="selecionarNota(1)" class="text-2xl text-gray-300" aria-label="1 estrela" aria-pressed="false">★</button>
              <button type="button" data-rating="2" onclick="selecionarNota(2)" class="text-2xl text-gray-300" aria-label="2 estrelas" aria-pressed="false">★</button>
              <button type="button" data-rating="3" onclick="selecionarNota(3)" class="text-2xl text-gray-300" aria-label="3 estrelas" aria-pressed="false">★</button>
              <button type="button" data-rating="4" onclick="selecionarNota(4)" class="text-2xl text-gray-300" aria-label="4 estrelas" aria-pressed="false">★</button>
              <button type="button" data-rating="5" onclick="selecionarNota(5)" class="text-2xl text-gray-300" aria-label="5 estrelas" aria-pressed="false">★</button>
            </div>
          </div>
          <label for="field-comment" class="block text-xs font-semibold text-gray-600">Resenha<textarea id="field-comment" rows="3" placeholder="Escreva sua resenha..." class="mt-1 w-full rounded border border-gray-300 px-2 py-1.5 text-sm"></textarea></label>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="cancelarCadastro()" class="flex-1 rounded bg-gray-200 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-300">Cancelar</button>
            <button type="button" id="save-book-button" onclick="salvarLivro()" class="flex-1 rounded bg-emerald-700 py-2 text-xs font-semibold text-white hover:bg-emerald-800">Salvar no acervo</button>
          </div>
        </div>
      </section>

      <section id="my-books" class="rounded border border-gray-200 bg-white p-4 shadow-sm">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-lg font-semibold text-gray-900">Livros (<span id="total-books">0</span>)</h2>
          <div class="flex gap-2">
            <div class="relative">
              <button id="filter-toggle" type="button" class="rounded bg-gray-100 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-200">Filtrar</button>
              <div id="filter-menu" class="absolute right-0 z-20 mt-2 hidden w-64 rounded border border-gray-300 bg-white p-2 shadow-xl"></div>
            </div>
            <button type="button" onclick="exportarAcervo()" class="rounded bg-gray-100 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-200">Exportar</button>
            <button type="button" onclick="document.getElementById('input-import-library').click()" class="rounded bg-gray-100 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-200">Importar</button>
            <input id="input-import-library" type="file" accept=".json,application/json" onchange="importarAcervo(event)" class="hidden" data-admin-preserve-hidden="true">
          </div>
        </div>
        <label for="input-library-search" class="sr-only">Pesquisar nos livros salvos</label>
        <input type="search" id="input-library-search" oninput="carregarListaSalva()" placeholder="Pesquisar no acervo..." class="mb-2 w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-100">
        <p class="mb-2 text-xs text-gray-500"><span id="visible-books">0</span> exibido(s)</p>
        <ul id="books-list" class="divide-y divide-gray-200">
          <li class="py-2 text-center text-sm text-gray-500">Nenhum livro cadastrado ainda.</li>
        </ul>
      </section>
    </section>
  </main>
  <div id="book-status-menu" class="fixed z-50 hidden w-52 rounded border border-gray-300 bg-white p-2 shadow-xl" data-admin-only data-admin-preserve-hidden="true"></div>
  <script src="./app.js"></script>
</body>
</html>
